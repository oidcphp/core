name: tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  linux_tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [ 8.5, 8.4, 8.3, 8.2 ]
        stability: [ prefer-lowest, prefer-stable ]
        jwt-library: [ 3, 4 ]

    name: PHP ${{ matrix.php }} - ${{ matrix.stability }} - jwt-library ${{ matrix.jwt-library }}.x

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: xdebug

      - name: Install dependencies
        uses: nick-invision/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 5
          # `--with` narrows the constraint in composer.json to one major version of web-token/jwt-library
          command: composer update --${{ matrix.stability }} --with web-token/jwt-library:^${{ matrix.jwt-library }} --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies
        if: matrix.stability == 'prefer-stable'
        run: composer audit

      - name: Cache static analysis results
        uses: actions/cache@v6
        with:
          path: .cache
          key: static-analysis-php${{ matrix.php }}-${{ matrix.stability }}-jwt${{ matrix.jwt-library }}-${{ hashFiles('composer.json') }}-${{ github.sha }}
          restore-keys: |
            static-analysis-php${{ matrix.php }}-${{ matrix.stability }}-jwt${{ matrix.jwt-library }}-${{ hashFiles('composer.json') }}-
            static-analysis-php${{ matrix.php }}-

      - name: Execute phpcs
        run: php -d xdebug.mode=off vendor/bin/phpcs

      - name: Execute phpstan
        run: php -d xdebug.mode=off vendor/bin/phpstan analyse --memory-limit=-1 --no-progress

      - name: Execute tests
        run: php -d xdebug.mode=coverage vendor/bin/phpunit

      - name: Code coverage
        uses: codecov/codecov-action@v7
